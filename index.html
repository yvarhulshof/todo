<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A local-first todo app. Your data never leaves your machine.">
<meta name="color-scheme" content="light dark">
<title>Todo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235b5bd6'/><path d='M28 52l14 14 30-32' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="assets/styles.css">

<div class="app" id="app">
  <aside class="sidebar" aria-label="Views and lists">
    <div class="sidebar__head">
      <span class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
               stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 6"/></svg>
        </span>
        Todo
      </span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Change theme" title="Change theme">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
    </div>
    <nav class="sidebar__scroll" id="sidebar-nav"></nav>
    <div class="sidebar__foot" id="save-status"></div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="scroll-area">
      <div class="content" id="content">
        <div id="list"></div>
      </div>
    </div>
  </main>
</div>

<noscript>
  <p style="padding:24px;font-family:system-ui">This app needs JavaScript. It runs entirely in your
  browser and makes no network requests.</p>
</noscript>

<script type="module" src="src/main.js"></script>
<script>
  // Offline support. Registration is skipped on file:// and on any origin
  // where service workers are unavailable, so the app still runs.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
